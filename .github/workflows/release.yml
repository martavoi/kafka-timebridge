name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: test
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests
        run: go test -short ./...

  # ---------------------------------------------------------------------------
  # Job 2: e2e — full message lifecycle test (produce → store → schedule → deliver)
  # Runs only on main; heavier than PR checks but gates all releases.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      E2E_BROKER: localhost:9092
      E2E_INPUT_TOPIC: timebridge
      E2E_DEST_TOPIC: e2e-destination
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Start broker
        run: docker compose up -d --wait broker

      - name: Create topics
        run: |
          docker compose exec broker /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic $E2E_INPUT_TOPIC --partitions 1 --replication-factor 1
          docker compose exec broker /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic $E2E_DEST_TOPIC --partitions 1 --replication-factor 1

      - name: Start timebridge
        run: |
          SCHEDULER_POLL_INTERVAL_SECONDS=1 LOG_LEVEL=debug KAFKA_TOPIC=$E2E_INPUT_TOPIC \
            docker compose up -d --build timebridge

      - name: Run e2e tests
        run: CGO_ENABLED=1 go test -v -timeout 120s -count=1 ./e2e/

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Job 3: semantic-release
  # Outputs: version (e.g. "v1.2.3"), released ("true"/"false")
  # ---------------------------------------------------------------------------
  semantic-release:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

          git fetch --tags

          TAG=$(git tag --points-at HEAD 2>/dev/null | head -n1)
          if [ -n "$TAG" ]; then
            echo "released=true"  >> $GITHUB_OUTPUT
            echo "version=${TAG}" >> $GITHUB_OUTPUT
            echo "New release: ${TAG}"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "version="       >> $GITHUB_OUTPUT
            echo "No new release created."
          fi

  # ---------------------------------------------------------------------------
  # Job 4: build-binaries (matrix: amd64 + arm64)
  # NOTE: ubuntu-24.04-arm is free for public repos; paid plan required for
  # private repos.
  # ---------------------------------------------------------------------------
  build-binaries:
    runs-on: ${{ matrix.runner }}
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            goarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.semantic-release.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o dist/kafka-timebridge-linux-${{ matrix.arch }} \
              ./cmd

      - name: Compress binary
        run: |
          cd dist
          tar -czf kafka-timebridge-linux-${{ matrix.arch }}.tar.gz \
              kafka-timebridge-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/kafka-timebridge-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 5: upload-binaries
  # ---------------------------------------------------------------------------
  upload-binaries:
    runs-on: ubuntu-latest
    needs:
      - semantic-release
      - build-binaries
    if: needs.semantic-release.outputs.released == 'true'
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-linux-*
          merge-multiple: true
          path: dist/

      - name: Upload binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          ls -lh dist/
          gh release upload "${VERSION}" dist/*.tar.gz \
            --repo ${{ github.repository }} \
            --clobber

  # ---------------------------------------------------------------------------
  # Job 6: docker-build (matrix: native amd64 + arm64, no QEMU)
  # Each leg builds for its own platform natively and pushes by digest only.
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.semantic-release.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 7: docker-merge — combine per-platform digests into a manifest list
  # ---------------------------------------------------------------------------
  docker-merge:
    runs-on: ubuntu-latest
    needs:
      - semantic-release
      - docker-build
    if: needs.semantic-release.outputs.released == 'true'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
          REPO: ghcr.io/${{ github.repository }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${REPO}:latest" \
            --tag "${REPO}:${VERSION}" \
            $(printf "${REPO}@sha256:%s " *)

  # ---------------------------------------------------------------------------
  # Job 8: update-release-notes
  # ---------------------------------------------------------------------------
  update-release-notes:
    runs-on: ubuntu-latest
    needs:
      - semantic-release
      - upload-binaries
      - docker-merge
    if: needs.semantic-release.outputs.released == 'true'
    steps:
      - name: Append Docker info to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          CURRENT_BODY=$(gh release view "${VERSION}" \
            --repo "${REPO}" \
            --json body \
            --jq '.body')

          DOWNLOADS_SECTION=$(printf '\n## Downloads\n\n| Platform | Binary |\n|----------|--------|\n| Linux amd64 | [kafka-timebridge-linux-amd64.tar.gz](https://github.com/%s/releases/download/%s/kafka-timebridge-linux-amd64.tar.gz) |\n| Linux arm64 | [kafka-timebridge-linux-arm64.tar.gz](https://github.com/%s/releases/download/%s/kafka-timebridge-linux-arm64.tar.gz) |\n' \
            "${REPO}" "${VERSION}" "${REPO}" "${VERSION}")

          DOCKER_SECTION=$(printf '\n## Docker\n\n```sh\ndocker pull ghcr.io/%s:%s\n```\n\n**Supported platforms:** `linux/amd64`, `linux/arm64`\n' \
            "${REPO}" "${VERSION}")

          printf '%s%s%s' "${CURRENT_BODY}" "${DOWNLOADS_SECTION}" "${DOCKER_SECTION}" | \
            gh release edit "${VERSION}" \
              --repo "${REPO}" \
              --notes-file -
